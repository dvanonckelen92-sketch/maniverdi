[build]
  command = "npm run build"
  publish = "dist"

# 301-redirects van de oude WordPress-site (maniverdi.be) naar de nieuwe URL's,
# zodat geïndexeerde pagina's en oude links niet op een 404 uitkomen.
[[redirects]]
  from = "/diensten/"
  to = "/"
  status = 301

[[redirects]]
  from = "/tuinontwerp/"
  to = "/tuinontwerp-hasselt/"
  status = 301

[[redirects]]
  from = "/tuinaanleg/"
  to = "/tuinaanleg-hasselt/"
  status = 301

[[redirects]]
  from = "/tuinonderhoud/"
  to = "/tuinonderhoud-hasselt/"
  status = 301

[[redirects]]
  from = "/rioleringswerken/"
  to = "/rioleringswerken-hasselt/"
  status = 301

[[redirects]]
  from = "/grond-afbraakwerken/"
  to = "/grondwerken-hasselt/"
  status = 301

[[redirects]]
  from = "/grond-en-afbraakwerken/"
  to = "/grondwerken-hasselt/"
  status = 301

[[redirects]]
  from = "/klinker-en-bestratingswerken/"
  to = "/tuinaanleg-hasselt/"
  status = 301

[[redirects]]
  from = "/totaalprojecten/"
  to = "/realisaties/"
  status = 301

[[redirects]]
  from = "/ontwerpen/"
  to = "/realisaties/"
  status = 301

[[redirects]]
  from = "/onderhoud/"
  to = "/realisaties/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
